# Dependency updates (SPEC 10.3): root npm monthly, grouped; GitHub Actions monthly, grouped.
# playwright is pinned exactly (1.56.1) because the CI container tag must match it
# (mcr.microsoft.com/playwright:v1.56.1-noble); bump both together by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [type:tooling]
    ignore:
      - dependency-name: playwright
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [type:tooling]
    groups:
      actions:
        patterns: ['*']
